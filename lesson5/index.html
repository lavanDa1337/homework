<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Практика по формам</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form>
      <h2>Ваши личные данные</h2>
      <fieldset>
        <label class="city">
          Выберите город доставки
          <select name="city" required>
            <option value="" disabled selected>Не выбрано</option>
            <option value="krsk">Красноярск</option>
            <option value="nsk">Новосибирск</option>
            <option value="msk">Москва</option>
            <option value="spb">Санкт-Петербург</option>
          </select>
        </label>
        <label>
          Как вас зовут?
          <input type="text" placeholder="Имя" name="first-name" required />
          <input type="text" placeholder="Фамилия" name="last-name" required />
        </label>
        <label>
          Ваш возраст
          <input
            type="number"
            placeholder="Возраст"
            inputmode="numeric"
            name="age"
            required
          />
        </label>
        <label>
          Дата рождения
          <input type="date" name="date" required />
        </label>
        <label>
          Ваш номер телефона
          <input
            type="tel"
            placeholder="Номер телефона"
            inputmode="tel"
            name="phone"
            required
          />
        </label>
        <label>
          Ваша почта
          <input
            type="email"
            placeholder="Ваша почта"
            inputmode="email"
            name="email"
            required
          />
        </label>
        <label>
          Фото профиля
          <input type="file" name="photo" required />
        </label>
      </fieldset>
      <fieldset>
        <legend>Доп. информация</legend>
        <label>
          <textarea class="info" name="message" required></textarea>
        </label>
      </fieldset>
      <label class="pd">
        <input type="checkbox" name="pd" required />Я принимаю правила
      </label>
      <button type="submit">Отправить форму</button>
      <button type="reset">Очистить</button>
    </form>
  </body>
</html>
